[package]
name = "wyoming-asr"
version = "0.1.0"
edition = "2024"
description = "Multi-engine speech-to-text service with Wyoming protocol for Home Assistant"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = "0.5"
rusqlite = { version = "0.35", features = ["bundled"] }
rubato = "0.16"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", features = ["stream"] }
tokio-stream = "0.1"
chrono = { version = "0.4", features = ["serde"] }
async-stream = "0.3"
url = "2"
flate2 = "1"
tar = "0.4"
bzip2 = "0.5"

# STT engine (optional — tests use mock)
transcribe-rs = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

[features]
default = []
whisper = ["transcribe-rs", "transcribe-rs/whisper-cpp"]
whisper-cuda = ["whisper", "transcribe-rs/whisper-cuda"]
onnx = ["transcribe-rs", "transcribe-rs/onnx"]
ort-cuda = ["onnx", "transcribe-rs/ort-cuda"]
vad-silero = ["transcribe-rs/vad-silero"]
all-engines = ["whisper", "onnx", "vad-silero"]
all-engines-cuda = ["whisper-cuda", "ort-cuda", "vad-silero"]

[profile.release]
opt-level = 3
