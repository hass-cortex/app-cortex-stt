---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^cortex-stt/(tsconfig.*\.json|biome\.json)$
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  # ─── Mirrors of hassio-addons/workflows app-ci.yaml lint jobs ───
  # The release deploy chain calls app-ci as a reusable workflow; any of
  # these failing blocks deploy. Catch them locally so a tag push doesn't
  # discover Dockerfile / YAML / shell mistakes the hard way.

  # `.yamllint` config in repo root sets the rules.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.14.0
    hooks:
      - id: hadolint
        files: ^cortex-stt/Dockerfile(\..+)?$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["-s", "bash"] # matches SHELLCHECK_OPTS in app-ci.yaml
        # s6-overlay run/finish scripts have no .sh extension and use a
        # non-standard `#!/command/with-contenv bashio` shebang, so the
        # default identify heuristics miss them — list them explicitly.
        files: |
          (?x)^(
            .*\.sh|
            cortex-stt/rootfs/etc/s6-overlay/s6-rc\.d/[^/]+/(run|finish)
          )$

  - repo: local
    hooks:
      # Mirror the Prettier step in hassio-addons/workflows/.github/workflows/
      # app-ci.yaml@v2.0.6 — it pins prettier@3.8.3 and runs --check on the
      # whole repo (minus .prettierignore). Catch the same issues locally so
      # the release deploy doesn't get blocked on whitespace.
      - id: prettier-md
        name: prettier (markdown)
        entry: prettier
        language: node
        additional_dependencies: ["prettier@3.8.3"]
        files: \.md$
        args: ["--write"]

      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd cortex-stt && cargo fmt --check'
        language: system
        files: ^cortex-stt/.*\.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cd cortex-stt && cargo clippy --all-targets -- -D warnings'
        language: system
        stages: [pre-push]
        files: ^cortex-stt/(src|tests)/.*\.rs$|^cortex-stt/Cargo\.(toml|lock)$
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: bash -c 'cd cortex-stt && cargo test'
        language: system
        stages: [pre-push]
        files: ^cortex-stt/(src|tests)/.*\.rs$|^cortex-stt/Cargo\.(toml|lock)$
        pass_filenames: false

      # Requires: cargo install --locked cargo-deny
      - id: cargo-deny
        name: cargo deny check
        entry: bash -c 'cd cortex-stt && cargo deny check'
        language: system
        stages: [pre-push]
        files: ^cortex-stt/(Cargo\.(toml|lock)|deny\.toml)$
        pass_filenames: false

      - id: bun-lint
        name: bun lint (biome)
        entry: bash -c 'cd cortex-stt/web && bun run lint'
        language: system
        files: ^cortex-stt/web/.*\.(ts|tsx|js|jsx|json)$
        pass_filenames: false

      - id: bun-typecheck
        name: bun typecheck
        entry: bash -c 'cd cortex-stt/web && bun run typecheck'
        language: system
        stages: [pre-push]
        files: ^cortex-stt/web/.*\.(ts|tsx)$|^cortex-stt/web/tsconfig.*\.json$
        pass_filenames: false
