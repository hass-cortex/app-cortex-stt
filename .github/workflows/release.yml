---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Prevent whisper.cpp from compiling with -march=native (avoids SIGILL on targets lacking AVX-512)
  GGML_NATIVE: 'OFF'

jobs:
  build-binary:
    name: Build binary (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        working-directory: cortex-stt
        run: |
          cargo build --release
          strip target/release/cortex-stt || true
          cp target/release/cortex-stt ../cortex-stt-x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cortex-stt-x86_64-unknown-linux-gnu
          path: cortex-stt-x86_64-unknown-linux-gnu

  build-web:
    name: Build Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install and build
        working-directory: cortex-stt/web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Package web UI
        run: tar -czf cortex-stt-web.tar.gz -C cortex-stt/web/dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cortex-stt-web
          path: cortex-stt-web.tar.gz

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binary, build-web]
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Use PAT so that the release.published event triggers deploy.yaml.
          # GITHUB_TOKEN-created releases do not trigger downstream workflows.
          token: ${{ secrets.DISPATCH_TOKEN }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/cortex-stt-x86_64-unknown-linux-gnu/cortex-stt-x86_64-unknown-linux-gnu
            artifacts/cortex-stt-web/cortex-stt-web.tar.gz
