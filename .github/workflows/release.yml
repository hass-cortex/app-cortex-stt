---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Prevent whisper.cpp from compiling with -march=native (avoids SIGILL on targets lacking AVX-512)
  GGML_NATIVE: 'OFF'

jobs:
  catalog-freshness:
    name: Catalog freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a tag build must not read anything a pull request could have written.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      # A release ships the files upstream pins: pins are commits and keep
      # installing, but a stale snapshot would freeze old ones into this
      # version for good. Deliberately not in ci.yml:
      # this depends on upstream and would fail pull requests for reasons
      # unrelated to their changes.
      - name: Re-sync and compare
        working-directory: cortex-stt
        run: |
          uv run scripts/sync-catalog.py
          if ! git diff --quiet src/model/catalog.json; then
            echo "::error::Vendored catalog is stale. Run 'uv run scripts/sync-catalog.py', review the diff, run 'cargo test', commit, and re-tag."
            git --no-pager diff --stat src/model/catalog.json
            exit 1
          fi
          echo "Catalog matches upstream."

  build-binary:
    name: Build binary (x86_64)
    runs-on: ubuntu-latest
    needs: [catalog-freshness]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Build release binary
        working-directory: cortex-stt
        run: |
          cargo build --release
          strip target/release/cortex-stt || true
          cp target/release/cortex-stt ../cortex-stt-x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cortex-stt-x86_64-unknown-linux-gnu
          path: cortex-stt-x86_64-unknown-linux-gnu

  build-web:
    name: Build Web UI
    runs-on: ubuntu-latest
    needs: [catalog-freshness]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.0"
          no-cache: true

      - name: Install and build
        working-directory: cortex-stt/web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Package web UI
        run: tar -czf cortex-stt-web.tar.gz -C cortex-stt/web/dist .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cortex-stt-web
          path: cortex-stt-web.tar.gz

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binary, build-web]
    # The release itself is created with DISPATCH_TOKEN, not GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release notes need the tags
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Generate release notes
        # Rendered from the conventional commits since the previous version tag,
        # under Breaking Changes / Features / Fixes / Other Changes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          prev_tag=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | grep -vx "${TAG_NAME}" | head -1)
          status=0
          uvx --from commitizen==4.19.0 cz changelog --dry-run \
            --template .github/release-notes.md.j2 \
            ${prev_tag:+--start-rev "${prev_tag}"} > body.md || status=$?
          # 3 = no commits since the previous tag; anything else is a real failure
          if [[ "${status}" -ne 0 && "${status}" -ne 3 ]]; then
            exit "${status}"
          fi
          # Only ci/docs/chore commits render nothing; a release body is never empty
          if ! grep -q '[^[:space:]]' body.md; then
            printf '## Other Changes\n\n- Build, CI and documentation changes only\n' > body.md
          fi
          cat body.md

      - name: Create GitHub Release
        # zizmor: ignore[superfluous-actions] - gh release cannot set
        # prerelease from an expression without extra scripting
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # Use PAT so that the release.published event triggers deploy.yaml.
          # GITHUB_TOKEN-created releases do not trigger downstream workflows.
          token: ${{ secrets.DISPATCH_TOKEN }}
          name: ${{ github.ref_name }}
          body_path: body.md
          # Auto-mark semver pre-release tags (e.g. 0.1.4-beta.1) as
          # prerelease so deploy.yaml routes them to
          # repository-beta only, leaving the stable catalog untouched.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/cortex-stt-x86_64-unknown-linux-gnu/cortex-stt-x86_64-unknown-linux-gnu
            artifacts/cortex-stt-web/cortex-stt-web.tar.gz
