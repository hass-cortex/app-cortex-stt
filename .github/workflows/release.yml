---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Prevent whisper.cpp from compiling with -march=native (avoids SIGILL on targets lacking AVX-512)
  GGML_NATIVE: 'OFF'

jobs:
  catalog-freshness:
    name: Catalog freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a tag build must not read anything a pull request could have written.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      # A stale pin ships a model nobody can install, so a tag fails here
      # rather than at the user's download. Deliberately not in ci.yml:
      # this depends on upstream and would fail pull requests for reasons
      # unrelated to their changes.
      - name: Re-sync and compare
        working-directory: cortex-stt
        run: |
          uv run scripts/sync-catalog.py
          if ! git diff --quiet src/model/catalog.json; then
            echo "::error::Vendored catalog is stale. Run 'uv run scripts/sync-catalog.py', review the diff, run 'cargo test', commit, and re-tag."
            git --no-pager diff --stat src/model/catalog.json
            exit 1
          fi
          echo "Catalog matches upstream."

  build-binary:
    name: Build binary (x86_64)
    runs-on: ubuntu-latest
    needs: [catalog-freshness]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Build release binary
        working-directory: cortex-stt
        run: |
          cargo build --release
          strip target/release/cortex-stt || true
          cp target/release/cortex-stt ../cortex-stt-x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cortex-stt-x86_64-unknown-linux-gnu
          path: cortex-stt-x86_64-unknown-linux-gnu

  build-web:
    name: Build Web UI
    runs-on: ubuntu-latest
    needs: [catalog-freshness]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.0"
          no-cache: true

      - name: Install and build
        working-directory: cortex-stt/web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Package web UI
        run: tar -czf cortex-stt-web.tar.gz -C cortex-stt/web/dist .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cortex-stt-web
          path: cortex-stt-web.tar.gz

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binary, build-web]
    # The release itself is created with DISPATCH_TOKEN, not GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Create GitHub Release
        # zizmor: ignore[superfluous-actions] - gh release cannot set
        # prerelease from an expression without extra scripting
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # Use PAT so that the release.published event triggers deploy.yaml.
          # GITHUB_TOKEN-created releases do not trigger downstream workflows.
          token: ${{ secrets.DISPATCH_TOKEN }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # Auto-mark semver pre-release tags (e.g. 0.1.4-beta.1) as
          # prerelease so hassio-addons app-deploy.yaml routes them to
          # repository-beta only, leaving the stable catalog untouched.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/cortex-stt-x86_64-unknown-linux-gnu/cortex-stt-x86_64-unknown-linux-gnu
            artifacts/cortex-stt-web/cortex-stt-web.tar.gz
