name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Prevent whisper.cpp from compiling with -march=native (avoids SIGILL on targets lacking AVX-512)
  GGML_NATIVE: 'OFF'

jobs:
  build-binary:
    name: Build binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: cortex-stt-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact: cortex-stt-aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu' && runner.arch != 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release binary
        working-directory: cortex-stt
        run: |
          cargo build --release --features all-engines,vad-silero
          strip target/release/cortex-stt || true
          cp target/release/cortex-stt ../${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-web:
    name: Build Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install and build
        working-directory: cortex-stt/web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Package web UI
        run: tar -czf cortex-stt-web.tar.gz -C cortex-stt/web/dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-stt-web
          path: cortex-stt-web.tar.gz

  docker:
    name: Docker ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs: [build-binary, build-web]
    strategy:
      matrix:
        variant: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: cortex-stt-x86_64-unknown-linux-gnu
          path: .

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: cortex-stt-web
          path: .

      - name: Prepare build context
        run: |
          chmod +x cortex-stt-x86_64-unknown-linux-gnu
          mkdir -p docker-build/web/dist
          cp cortex-stt-x86_64-unknown-linux-gnu docker-build/cortex-stt
          tar -xzf cortex-stt-web.tar.gz -C docker-build/web/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.variant }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.variant }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.variant }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binary, build-web, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/cortex-stt-x86_64-unknown-linux-gnu/cortex-stt-x86_64-unknown-linux-gnu
            artifacts/cortex-stt-aarch64-unknown-linux-gnu/cortex-stt-aarch64-unknown-linux-gnu
            artifacts/cortex-stt-web/cortex-stt-web.tar.gz
