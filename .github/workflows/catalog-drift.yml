---
name: Catalog drift

# Surfaces upstream catalog drift as a reviewable PR. Never auto-merges:
# the vendored pins (a commit + SHA-256 per file) stay authoritative, and
# the review is what keeps them so. Drift is never urgent — a pinned
# commit keeps serving its files after upstream moves on.

# yamllint disable-line rule:truthy
on:
  schedule:
    # Mondays, 06:00 UTC — a fresh diff waiting at the start of the week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Re-sync and open a PR on drift
    runs-on: ubuntu-latest
    steps:
      # Credentials stay: the push below is what opens the drift PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Re-sync catalog
        working-directory: cortex-stt
        # The log's "Review before committing" list goes into the PR body.
        run: uv run scripts/sync-catalog.py 2>&1 | tee "$RUNNER_TEMP/sync.log"

      # A PR opened with GITHUB_TOKEN does not trigger workflows, so this
      # one arrives with no checks — hence the body asking for cargo test.
      - name: Open or update the drift PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet cortex-stt/src/model/catalog.json; then
            echo "Catalog matches upstream. Nothing to do."
            exit 0
          fi

          echo "Drift detected:"
          git --no-pager diff --stat cortex-stt/src/model/catalog.json

          # One long-lived branch, force-pushed: a second week of drift
          # updates the open PR instead of stacking a duplicate.
          BRANCH=chore/catalog-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add cortex-stt/src/model/catalog.json
          git commit -m "chore(catalog): re-sync vendored snapshot

          Upstream published new model files or models. The current pins
          keep installing; this moves them to the commits upstream pins.

          Review the diff, then merge. Opened automatically."
          git push --force origin "$BRANCH"

          {
            echo "Upstream published new model files or models. Each model is pinned to a Hugging Face commit, so the current snapshot keeps installing; merging moves the pins to the commits upstream pins (never back to older bytes)."
            echo
            echo "Before merging: run \`cargo test --no-default-features\` for the catalog consistency tests, and check the sync notes below — models removed or renamed upstream disappear from the app's catalog (a rename recreates the HA entity; list it in the release notes)."
            echo
            echo '```'
            awk '/^(Skipped|Review before committing):/ { on = 1 } on' "$RUNNER_TEMP/sync.log"
            echo '```'
            echo
            echo "Opened by the weekly \`Catalog drift\` workflow."
          } > "$RUNNER_TEMP/body.md"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
            echo "Existing PR updated."
          else
            gh pr create \
              --base main --head "$BRANCH" \
              --title "chore(catalog): re-sync vendored snapshot" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
