# Wyoming ASR - CUDA GPU override
#
# Usage (always combined with base):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.cuda.yml up -d

services:
  wyoming-asr:
    image: ghcr.io/hass-cortex/wyoming-asr:latest-cuda
    environment:
      - GPU_MODE=cuda
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
