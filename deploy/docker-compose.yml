# Wyoming ASR - Docker Compose (CPU)
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#
# GPU (CUDA):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.cuda.yml up -d

services:
  wyoming-asr:
    image: ghcr.io/hass-cortex/wyoming-asr:latest-cpu
    container_name: wyoming-asr
    restart: unless-stopped
    ports:
      - "10300:10300"  # Wyoming protocol
      - "10400:10400"  # Admin UI / HTTP API
    volumes:
      - wyoming-asr-data:/data
      - wyoming-asr-config:/config
    environment:
      - DEFAULT_MODEL=whisper-small
      - RUST_LOG=info

volumes:
  wyoming-asr-data:
  wyoming-asr-config:
