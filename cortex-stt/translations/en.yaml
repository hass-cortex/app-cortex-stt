---
configuration:
  log_level:
    name: Log Level
    description: Logging verbosity level
  log_filter:
    name: Log Filter (advanced)
    description: >-
      Raw RUST_LOG filter that overrides Log Level when set. The Log Level
      debug/trace settings only raise this app's own logs and keep dependency
      crates at info; set a filter here (e.g. "info,ort=debug" or
      "info,cortex_stt=debug,hyper=debug") to capture a dependency's logs when
      diagnosing model-load, HTTP, or resampling issues. Leave empty to use
      Log Level.
  discovery_api_key:
    name: Home Assistant discovery API key
    description: >-
      API key used by the Cortex STT integration in Home Assistant. Generated
      automatically on first start and pushed to the Home Assistant Supervisor
      via the discovery service. Clear this field and restart the app to rotate
      the key — the integration picks up the new value automatically.
network:
  8769/tcp: STT HTTP API and Admin UI
