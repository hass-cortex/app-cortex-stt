# cargo-deny configuration (schema v2)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "warn"
ignore = [
    # RUSTSEC-2025-0141: bincode 2.0.1, transitive via `ferrous-opencc`, whose team
    # stopped development by choice. An "unmaintained" advisory, not a
    # vulnerability, and it is not ours to upgrade — dropping it means dropping
    # the script conversion the language subtags render with. Revisit if
    # ferrous-opencc moves off bincode or an advisory with teeth lands on it.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained by choice; transitive via ferrous-opencc" },
]

[licenses]
version = 2
# Keep a broad allow list even if a particular license isn't used today —
# a dep update could pull one in without warning.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # bzip2 0.6+ defaults to the pure-Rust libbz2-rs-sys backend, which inherits
    # this license from the original C bzip2 library.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
