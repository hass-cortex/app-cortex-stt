# cargo-deny configuration (schema v2)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0150: audiopus_sys (transitive via `opus 0.3`) is unmaintained.
    # This is an "unmaintained" advisory, not a security vulnerability, and no safe
    # upgrade exists upstream (last commit 5 years ago; maintainer unresponsive).
    # The bundled C build still compiles on our CI and runtime. Revisit if CMake 4.0
    # actually breaks the build, or once a maintained Opus binding becomes available.
    { id = "RUSTSEC-2026-0150", reason = "audiopus_sys unmaintained; no upstream fix, build still works" },
]

[licenses]
version = 2
# Keep a broad allow list even if a particular license isn't used today —
# a dep update could pull one in without warning.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # bzip2 0.6+ defaults to the pure-Rust libbz2-rs-sys backend, which inherits
    # this license from the original C bzip2 library.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
