[package]
name = "cortex-stt"
version = "0.1.5"
edition = "2024"
description = "Multi-engine speech-to-text HTTP service powered by transcribe-rs"
license = "MIT"

[[bin]]
name = "cortex-stt"
path = "src/main.rs"

[[bin]]
name = "asr-cli"
path = "src/bin/asr-cli.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-rusqlite = "0.7"
rubato = "0.16"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio-stream = "0.1"
chrono = { version = "0.4", features = ["serde"] }
async-stream = "0.3"
url = "2"
flate2 = "1"
tar = "0.4"
bzip2 = "0.5"
toml = "0.8"
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }
gethostname = "0.5"

# STT engine (optional — tests use mock)
transcribe-rs = { version = "0.3.5", optional = true }


[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

[features]
default = ["whisper", "onnx", "vad-silero"]
whisper = ["transcribe-rs", "transcribe-rs/whisper-cpp"]
onnx = ["transcribe-rs", "transcribe-rs/onnx"]
vad-silero = ["transcribe-rs/vad-silero"]
cuda = ["whisper", "onnx", "vad-silero", "transcribe-rs/whisper-cuda", "transcribe-rs/ort-cuda"]

[profile.release]
opt-level = 3
