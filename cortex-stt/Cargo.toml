[package]
name = "cortex-stt"
version = "0.3.2"
edition = "2024"
description = "Multi-model speech-to-text HTTP service powered by transcribe.cpp"
license = "MIT"

[[bin]]
name = "cortex-stt"
path = "src/main.rs"

[[bin]]
name = "asr-cli"
path = "src/bin/asr-cli.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["multipart", "macros", "ws"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tower = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-rusqlite = "0.7"
rubato = "2"
opus = "0.3"
ogg = "0.9"
sha2 = "0.11"
hex = "0.4"
rand = "0.10"
reqwest = { version = "0.13", features = ["stream", "json"] }
tokio-stream = "0.1"
chrono = { version = "0.4", features = ["serde"] }
async-stream = "0.3"
url = "2"
toml = "1"
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }
gethostname = "1.1"

# STT engine (optional — tests use mock)
transcribe-cpp = { version = "=0.1.3", default-features = false, optional = true }
# Self-referential holder for an active engine stream (Stream<'a> mutably
# borrows its Session; both must live in the bridge across feed calls).
ouroboros = { version = "0.18", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
tokio-tungstenite = "0.24"
futures-util = "0.3"

[features]
default = ["engine"]
engine = ["dep:transcribe-cpp", "dep:ouroboros"]
cuda = ["engine", "transcribe-cpp/cuda"]

[profile.release]
opt-level = 3
lto = true
strip = true
