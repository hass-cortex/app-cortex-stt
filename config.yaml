---
name: 'Wyoming ASR'
description: 'Multi-engine speech-to-text with Wyoming protocol'
version: '0.1.0'
slug: 'wyoming_asr'
url: 'https://github.com/hass-cortex/wyoming-asr'
init: false
startup: services
timeout: 300
arch:
  - amd64
  - aarch64
homeassistant: '2024.12.0'
discovery:
  - wyoming
backup_exclude:
  - 'models*'
  - 'audio*'
ingress: true
ingress_port: 10400
ingress_stream: true
panel_icon: mdi:microphone-message
panel_title: 'Wyoming ASR'
panel_admin: false
map:
  - type: addon_config
    read_only: false
options:
  default_model: 'whisper-small'
  language: 'en'
  gpu: false
  pool_size: 1
  debug_logging: false
schema:
  default_model: str
  language: str
  initial_prompt: str?
  gpu: bool
  pool_size: int(1,4)
  max_loaded_models: int(1,8)?
  idle_timeout: int(0,3600)?
  debug_logging: bool
ports:
  10300/tcp: null
  10400/tcp: null
ports_description:
  10300/tcp: 'Wyoming Protocol'
  10400/tcp: 'Admin Web UI / HTTP API'
