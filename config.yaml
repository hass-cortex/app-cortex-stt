name: Cortex STT Server
description: Multi-engine speech-to-text service with Whisper, Parakeet, SenseVoice, and more
version: '0.1.0'
slug: cortex_stt_server
url: https://github.com/hass-cortex/cortex-stt-server
arch:
  - amd64
  - aarch64
startup: services
init: false
timeout: 300
ingress: true
ingress_port: 10400
ingress_stream: true
panel_icon: mdi:microphone-message
panel_title: Cortex STT
panel_admin: true
ports:
  10400/tcp: null
ports_description:
  10400/tcp: STT HTTP API and Admin UI
map:
  - type: addon_config
    read_only: false
  - type: share
    read_only: false
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error|fatal)
